spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bet_derivative?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
    username: root
    password: ${BET_DERIVATIVE_DB_PASSWORD}
#    password: Ojas$0jas
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
