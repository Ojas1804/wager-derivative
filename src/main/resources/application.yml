spring:
  profiles:
    active: dev # Change to 'prod' in production or use env variable

  jackson:
    time-zone: UTC

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        transaction:
          coordinator_class: jdbc
        format_sql: false
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
